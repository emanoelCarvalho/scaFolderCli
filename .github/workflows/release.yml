name: Release

on:
  push:
    tags: ['v*']

# Publishing is a one-way door, so it happens only from a tag, only after the
# full suite passes, and only through this workflow.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:package

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:golden

  publish:
    needs: [verify, golden]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which ties the published tarball to this
      # workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # `prepack` cleans and rebuilds, so the tarball is never stale.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
